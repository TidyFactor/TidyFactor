name: TidyFactor Ecosystem CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-cli-and-manifest:
    name: Validate CLI & Master Suite Manifest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Audit CLI Doctor
        run: node bin/cli.js doctor

      - name: Test CLI Skill Listing
        run: node bin/cli.js list

      - name: Validate Master Manifest Integrity
        run: |
          node -e "
            const manifest = require('./MANIFEST.json');
            if (!manifest.skills || manifest.skills.length !== manifest.skills_count) {
              console.error('Mismatch in MANIFEST.json skills count');
              process.exit(1);
            }
            console.log('✔ Master Manifest verified:', manifest.skills_count, 'skills registered.');
          "
